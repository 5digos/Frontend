<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Pago Exitoso</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
        :root {
            --bg-accordion: oklch(26.8% 0.004 56.043); /* mismo que tu CSS */
        }

        body {
            background-color: var(--bg-accordion);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 2rem;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 100vh;
        }

        .spinner {
            border: 4px solid #ccc;
            border-top: 4px solid #10b981; /* Tailwind green-500 */
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .card {
            background-color: var(--bg-accordion);
            border: 1px solid #4b5563; /* Tailwind gray-600 */
            border-radius: 0.5rem;
            padding: 2rem;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }

        .text-green {
            color: #34d399; /* Tailwind green-400 */
        }

        .material-icons {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        pre {
            text-align: left;
            white-space: pre-wrap;
            margin-top: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            color: #d1d5db; /* Tailwind gray-300 */
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="material-icons text-green">check_circle</span>
        <h1 class="text-2xl font-bold text-white mb-4">¡Gracias por tu pago!</h1>
        <div id="statusMessage">
            <div class="spinner"></div>
            <p class="mt-2 text-gray-300">Estamos verificando tu pago...</p>
        </div>
        <pre id="paymentDetails" class="hidden"></pre>
        <p class="mt-6 text-sm text-gray-400">Serás redirigido automáticamente a la aplicación en <span id="countdown">10</span> segundos.</p>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const paymentId = params.get("payment_id");
    const countdownEl = document.getElementById("countdown");
    const paymentDetailsEl = document.getElementById("paymentDetails");
    const statusMessageEl = document.getElementById("statusMessage");

    
    const PAYMENT_BASE_URL = "https://localhost:7059/api";
    async function verifyPayment() {
      try {
          const response = await fetch(`${PAYMENT_BASE_URL}/payment/verify/${paymentId}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            }
        });
          if (!response.ok) {
              throw new Error("Error al verificar el pago");
          }

          const data = await response.json();
          localStorage.setItem("lastPayment", JSON.stringify(data));

          let counter = 10;
          const timer = setInterval(() => {
              counter--;
              countdownEl.textContent = counter;
              if (counter <= 0) {
                  clearInterval(timer);
                  window.location.href = "index.html";
              }
          }, 1000);

          // Ocultamos spinner
          statusMessageEl.style.display = "none";
          paymentDetailsEl.classList.remove("hidden");

          // Mostramos los datos formateados
          paymentDetailsEl.innerHTML = `
      <strong class="text-green-400">Pago exitoso</strong><br/>
      <span><strong>ID Pago:</strong> ${data.paymentId}</span><br/>
      <span><strong>ID Reserva:</strong> ${data.reservationId}</span><br/>
      <span><strong>Total abonado:</strong> $${data.amount}</span><br/>
      <span><strong>Recargo por demora:</strong> $${data.lateFee}</span><br/>
      <span><strong>Número de Transacción:</strong> ${data.transactionId}</span>
    `;
      } catch (err) {
        statusMessageEl.innerHTML = `<p class="text-red-400">❌ Ocurrió un error al verificar el pago.</p>`;
      }
    }

    if (paymentId) {
      verifyPayment();
    } else {
      statusMessageEl.innerHTML = `<p class="text-red-400">❌ No se encontró un ID de pago válido.</p>`;
    }
    </script>
</body>
</html>
