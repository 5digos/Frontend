<section class="flex flex-col min-h-screen">
  <div class="flex flex-row justify-between items-center">
    <h1 class="text-3xl font-semibold p-4">Rentify</h1>
    <button id="cancel-reservation-btn" class="hover:text-white cursor-pointer">
      <i class="text-2xl fa-solid fa-xmark pr-4"></i>
    </button>
  </div>

  <form id="reservation-form" class="mx-4 text-stone-800 dark:text-neutral-200">
    <!-- campos obligatorios -->
    <section
      class="flex flex-col gap-1 bg-neutral-200 dark:bg-stone-800 p-4 rounded"
    >
      <h1 class="text-2xl font-semibold">Reserva</h1>

      <!-- retiro -->
      <h1 class="text-xl text-stone-700 dark:text-neutral-400">Retiro</h1>

      <label for="branchInicio" class="block text-xl">Sucursal Inicio</label>
      <div class="flex items-center gap-2">
        <select
          id="branchInicio"
          name="branchInicio"
          required
          class="flex-grow text-lg border border-neutral-300 rounded-md px-3 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer"
        ></select>
        <i
          data-target-select="branchInicio"
          class="fa-solid fa-map-location-dot text-3xl mx-1 text-stone-400 hover:text-white cursor-pointer flex-shrink-0"
        ></i>
      </div>

      <label for="fechaInicio" class="text-xl">Fecha Inicio</label>
      <div class="flex gap-2 mb-1">
        <input
          type="date"
          id="fechaInicio"
          name="fechaInicio"
          required
          class="w-2/3 text-lg border border-neutral-300 rounded-md px-3 py-2 focus:outline-none focus:border-red-400 hover:border-neutral-300 transition duration-300"
        />
        <select
          id="horaInicio"
          name="horaInicio"
          required
          class="w-1/3 border border-neutral-300 rounded-md px-3 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer"
        >
          <option value="" disabled selected>Hora</option>
          <!-- las opciones se llenan por JS -->
        </select>
      </div>

      <hr class="my-2 border-t border-stone-400 dark:border-stone-600" />

      <!-- devolucion -->
      <h1 class="text-xl text-stone-700 dark:text-neutral-400">Devolucion</h1>

      <label for="branchDestino" class="block text-xl">Sucursal Destino</label>
      <div class="flex items-center gap-2">
        <select
          id="branchDestino"
          name="branchDestino"
          required
          class="flex-grow text-lg border border-neutral-300 rounded-md px-3 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer"
        ></select>
        <i
          data-target-select="branchDestino"
          class="fa-solid fa-map-location-dot text-3xl mx-1 text-stone-400 hover:text-white cursor-pointer flex-shrink-0"
        ></i>
      </div>

      <label for="fechaDevolucion" class="text-xl">Fecha de Devolución</label>
      <div class="flex gap-2">
        <input
          type="date"
          id="fechaDevolucion"
          name="fechaDevolucion"
          required
          class="w-2/3 text-lg border border-neutral-300 rounded-md px-3 py-2 focus:outline-none focus:border-red-400 hover:border-neutral-300 transition duration-300"
        />
        <select
          id="horaDevolucion"
          name="horaDevolucion"
          required
          class="w-1/3 border border-neutral-300 rounded-md px-3 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer"
        >
          <option value="" disabled selected>Hora</option>
          <!-- las opciones se llenan por JS -->
        </select>
      </div>
    </section>

    <!-- filtros opcionales -->
    <section
      class="flex flex-col gap-1 bg-neutral-200 dark:bg-stone-800 p-4 mt-3 rounded"
    >
      <h1 class="text-2xl font-semibold">Vehiculo</h1>
      <h1 class="text-xl mb-1 text-stone-700 dark:text-neutral-400">
        Filtros Opcionales
      </h1>
      <div class="flex gap-2">
        <div class="w-3/5 gap-2">
          <label for="category" class="block text-xl mb-1">Categoria</label>
          <select
            id="category"
            name="category"
            class="w-full text-lg border border-neutral-300 rounded-md px-3 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer"
          ></select>
        </div>
        <div class="w-2/5 gap-2">
          <label for="seatingCapacity" class="block text-xl mb-1"
            >Asientos</label
          >
          <select
            id="seatingCapacity"
            name="seatingCapacity"
            class="w-full text-lg border border-neutral-300 rounded-md px-3 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer"
          >
            <option value="" selected>Cualquiera</option>
            <option value="2">2</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="7">7</option>
          </select>
        </div>
      </div>

      <div class="flex gap-2">
        <div class="w-3/5 gap-2">
          <label for="transmission" class="block text-xl mb-1"
            >Transmision</label
          >
          <select
            id="transmission"
            name="transmission"
            class="text-lg w-full border border-neutral-300 rounded-md px-3 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer"
          ></select>
        </div>

        <div class="w-2/5 gap-2">
          <label for="maxPrice" class="block text-xl mb-1">Precio Max</label>
          <div class="relative">
            <span
              class="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-500 dark:text-neutral-400 pointer-events-none"
            >
              $
            </span>
            <input
              type="number"
              id="maxPrice"
              name="maxPrice"
              min="0"
              step="1"
              placeholder="0"
              class="text-lg w-full border border-neutral-300 rounded-md px-8 py-2 transition duration-300 bg-neutral-200 dark:bg-stone-800 focus:outline-none focus:border-red-400 hover:border-neutral-300 appearance-none cursor-pointer w-full"
            />
          </div>
        </div>
      </div>
    </section>

    <button
      type="submit"
      class="w-full p-2 mt-3 bg-red-500 hover:bg-red-600 rounded shadow-lg cursor-pointer mb-3"
    >
      Buscar
    </button>
  </form>
</section>

<!-- modal de elegir sucursal -->
<div
  id="map-modal"
  class="fixed inset-0 z-50 hidden bg-black/70 flex items-center justify-center"
>
  <div
    class="bg-white dark:bg-stone-900 rounded-2xl shadow-xl max-w-[340px] md:max-w-lg lg:max-w-xl w-full overflow-hidden relative flex flex-col"
  >
    <!-- header -->
    <div
      class="flex justify-between items-center px-6 py-4 border-b border-stone-300 dark:border-stone-700"
    >
      <h2 class="text-xl">Seleccionar sucursal</h2>
      <button
        id="map-modal-close"
        class="text-2xl text-stone-400 hover:text-white cursor-pointer"
      >
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- mapa -->
    <div id="map-modal-map" class="h-[300px] w-full"></div>

    <!-- footer -->
    <div
      class="p-4 flex justify-end border-t border-stone-300 dark:border-stone-700 gap-3"
    >
      <select
        id="branch-selected"
        name="branch-selected"
        type="text"
        class="w-full text-lg border rounded-lg px-3 py-2 transition duration-300 bg-stone-800 placeholder:text-stone-300 hover:border-red-400 focus:border-red-500 focus:outline-none appearance-none cursor-pointer"
      ></select>
      <button
        id="map-modal-select"
        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded font-semibold cursor-pointer"
      >
        Seleccionar
      </button>
    </div>
  </div>
</div>
