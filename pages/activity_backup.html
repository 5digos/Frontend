<section id="activity-section" class="px-4 py-5">
    <!-- Reserva Activa -->
    <div class="bg-accordion border border-gray-600 rounded-lg shadow-lg mb-6">
        <button onclick="toggleAccordion('active')" class="w-full p-4 flex items-center justify-between rounded-t-lg accordion-hover">
            <div class="flex-1 flex justify-center items-center gap-3">
                <span class="material-icons text-green-400 text-xl">directions_car</span>
                <span class="font-semibold text-white">Reserva Activa</span>
            </div>
            <svg id="active-arrow" class="w-5 h-5 text-gray-400 accordion-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div id="active-content" class="accordion-content">
            <!-- Contenido de reserva activa se carga dinámicamente -->
        </div>
    </div>

    <!-- Próxima Reserva -->
    <div class="bg-accordion border border-gray-600 rounded-lg shadow-lg mb-6">
        <button onclick="toggleAccordion('proxima')" class="w-full p-4 flex items-center justify-between rounded-t-lg accordion-hover">
            <div class="flex-1 flex justify-center items-center gap-3">
                <span id="proxima-icon" class="material-icons text-yellow-400 text-xl">event</span>
                <span id="proxima-title" class="font-semibold text-white">Próxima Reserva</span>
            </div>
            <svg id="proxima-arrow" class="w-5 h-5 text-gray-400 accordion-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div id="proxima-content" class="accordion-content">
            <!-- Contenido de próxima reserva se carga dinámicamente -->
        </div>
    </div>

    <!-- Historial de Reservas -->
    <div class="bg-accordion border border-gray-600 rounded-lg shadow-lg mb-6">
        <button onclick="toggleAccordion('historial')" class="w-full p-4 flex items-center justify-between rounded-t-lg accordion-hover">
            <div class="flex-1 flex justify-center items-center gap-3">
                <span class="material-icons text-purple-400 text-xl">history</span>
                <span class="font-semibold text-white">Historial de Reservas</span>
            </div>
            <svg id="historial-arrow" class="w-5 h-5 text-gray-400 accordion-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>
        <div id="historial-content" class="accordion-content">
            <!-- Contenido del historial se carga dinámicamente -->
        </div>
    </div>
</section>

<!-- Botón de scroll to top -->
<button id="scrollToTopBtn" class="scroll-to-top" title="Volver arriba">
    <i class="fa-solid fa-circle-chevron-up"></i>
</button>
