<!DOCTYPE html>
<section id="activity-section" class="px-4 py-5" role="main" aria-label="Gestión de reservas">
    <!-- Reserva Activa -->
    <article class="bg-accordion border border-gray-600 rounded-lg shadow-lg mb-6" aria-labelledby="active-title">
        <header>
            <button onclick="toggleAccordion('active')" 
                    class="w-full p-4 flex items-center justify-between rounded-t-lg accordion-hover"
                    aria-expanded="false" 
                    aria-controls="active-content"
                    id="active-button">
                <div class="flex-1 flex justify-center items-center gap-3">
                    <span class="material-icons text-green-400 text-xl" aria-hidden="true">directions_car</span>
                    <h2 id="active-title" class="font-semibold text-white">Reserva Activa</h2>
                </div>
                <svg id="active-arrow" class="w-5 h-5 text-gray-400 accordion-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </header>
        <div id="active-content" class="accordion-content" role="region" aria-labelledby="active-title"></div>
    </article>
    
    <!-- Próxima Reserva -->
    <article class="bg-accordion border border-gray-600 rounded-lg shadow-lg mb-6" aria-labelledby="proxima-title">
        <header>
            <button onclick="toggleAccordion('proxima')" 
                    class="w-full p-4 flex items-center justify-between rounded-t-lg accordion-hover"
                    aria-expanded="false" 
                    aria-controls="proxima-content"
                    id="proxima-button">
                <div class="flex-1 flex justify-center items-center gap-3">
                    <span id="proxima-icon" class="material-icons text-yellow-400 text-xl" aria-hidden="true">event</span>
                    <h2 id="proxima-title" class="font-semibold text-white">Próxima Reserva</h2>
                </div>
                <svg id="proxima-arrow" class="w-5 h-5 text-gray-400 accordion-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </header>
        <div id="proxima-content" class="accordion-content" role="region" aria-labelledby="proxima-title"></div>
    </article>
    
    <!-- Historial de Reservas -->
    <article class="bg-accordion border border-gray-600 rounded-lg shadow-lg mb-6" aria-labelledby="historial-title">
        <header>
            <button onclick="toggleAccordion('historial')" 
                    class="w-full p-4 flex items-center justify-between rounded-t-lg accordion-hover"
                    aria-expanded="false" 
                    aria-controls="historial-content"
                    id="historial-button">
                <div class="flex-1 flex justify-center items-center gap-3">
                    <span class="material-icons text-purple-400 text-xl" aria-hidden="true">history</span>
                    <h2 id="historial-title" class="font-semibold text-white">Historial de Reservas</h2>
                </div>
                <svg id="historial-arrow" class="w-5 h-5 text-gray-400 accordion-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            </button>
        </header>
        <div id="historial-content" class="accordion-content" role="region" aria-labelledby="historial-title"></div>
    </article>
</section>

<!-- Navegación auxiliar -->
<nav aria-label="Navegación rápida">
    <button id="scrollToTopBtn" class="scroll-to-top" title="Volver arriba" aria-label="Volver al inicio de la página">
        <i class="fa-solid fa-circle-chevron-up" aria-hidden="true"></i>
    </button>
</nav>
