<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Pendiente - Rentify</title>
    <link rel="icon" href="../img/rentifylogo.png" type="image/png" />
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
        body { background: #2d2d2d; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .center { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .icon { font-size: 5rem; color: #f59e42; }
        .btn { margin-top: 2rem; background: #f59e42; color: #fff; padding: 1rem 2rem; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
        .btn:hover { background: #d97706; }
    </style>
</head>
<body>
    <div class="center">
        <span class="material-icons icon">hourglass_empty</span>
        <h1>Pago Pendiente</h1>
        <p>Tu pago está siendo procesado. Te notificaremos cuando se confirme.</p>
        <button class="btn" onclick="window.location.href='home.html'">Volver al inicio</button>
    </div>
    <div class="centered">
        <span class="icon material-icons">hourglass_empty</span>
        <h1>Pago pendiente</h1>
        <p class="fade">Redirigiendo a la aplicación...</p>
    </div>
    <script>
        // Redirección automática después de mostrar mensaje de pendiente
        setTimeout(() => {
            const params = new URLSearchParams(window.location.search);
            let extra = '';
            if (params.has('payment_id')) extra += `&payment_id=${encodeURIComponent(params.get('payment_id'))}`;
            if (params.has('external_reference')) extra += `&external_reference=${encodeURIComponent(params.get('external_reference'))}`;
            window.location.href = window.location.origin + '/index.html?payment=pending' + extra;
        }, 2200);

        function buildRedirectUrl() {
            const baseUrl = window.location.origin + '/index.html';
            const paymentId = new URLSearchParams(window.location.search).get('payment_id');
            if (paymentId) {
                return `${baseUrl}?payment=pending&payment_id=${paymentId}`;
            } else {
                const allParams = window.location.search;
                if (allParams) {
                    // Reemplazar ? por & para concatenar correctamente
                    return `${baseUrl}?payment=pending${allParams.replace('?', '&')}`;
                } else {
                    return `${baseUrl}?payment=pending`;
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</body>
</html>
